imports:
    - { resource: services.yaml }
    - { resource: 'local/' }

parameters:
    secret: ThisTokenIsNotSoSecretChangeItImmediately
    opendxp_test.db.dsn: '%env(OPENDXP_TEST_DB_DSN)%'
    env(OPENDXP_TEST_DB_DSN): ~
    opendxp.encryption.secret: 'def00000fc1e34a17a03e2ef85329325b0736a5941633f8062f6b0a1a20f416751af119256bea0abf83ac33ef656b3fff087e1ce71fa6b8810d7f854fe2781f3fe4507f6'

doctrine:
    dbal:
        connections:
            default:
                url: '%opendxp_test.db.dsn%'
                mapping_types:
                    enum: string
                    bit: boolean

opendxp:
    email:
        sender:
            name: opendxp
            email: contact@opendxp.ch
        return:
            name: opendxp
            email: contact@opendxp.ch
    config_location:
        image_thumbnails:
            write_target:
                type: 'settings-store'
        video_thumbnails:
            write_target:
                type: 'settings-store'
        document_types:
            write_target:
                type: 'settings-store'
        predefined_properties:
            write_target:
                type: 'settings-store'
        predefined_asset_metadata:
            write_target:
                type: 'settings-store'
        perspectives:
            write_target:
                type: 'settings-store'
        custom_views:
            write_target:
                type: 'settings-store'
        object_custom_layouts:
            write_target:
                type: 'settings-store'
        system_settings:
            write_target:
                type: 'settings-store'
            read_target:
                type: 'settings-store'
        select_options:
            write_target:
                type: 'settings-store'
