
name: "Psalm Static Analysis"

on:
    pull_request:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
    push:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
            - "*_actions"

jobs:
    psalm:
        name: Psalm
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Psalm
              uses: docker://ghcr.io/psalm/psalm-github-actions
              env:
                  # The container cannot read the version from git, and the test foundation requires core ^1.3.
                  COMPOSER_ROOT_VERSION: 1.x-dev
              with:
                security_analysis: true
                composer_ignore_platform_reqs: true
