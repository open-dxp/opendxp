name: Security analysis

on:
    push:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
    pull_request:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"

jobs:
    security-analysis:
        uses: open-dxp/workflows-collection-public/.github/workflows/reusable-security-analysis.yaml@main
        permissions:
            contents: read
            security-events: write
        secrets:
            COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
