parameters:
    locale: en

framework:
    translator:
      fallbacks: ["%locale%"]
    secret: "%secret%"
    serializer:
        enabled: true
    router:
        strict_requirements: ~
        utf8: true
    csrf_protection: ~
    validation: { enable_attributes: true }
    default_locale:  "%locale%"
    session:
        # http://symfony.com/doc/current/reference/configuration/framework.html#handler-id
        # use the native PHP session mechanism
        handler_id:  null
        cookie_samesite: 'strict'
        storage_factory_id: session.storage.factory.native
        cookie_secure: auto
    php_errors:
        log: true
    assets: ~
    http_method_override: false
    mailer:
        enabled: true
        transports:
            main: native://default
    messenger:
        transports:
            opendxp_core: "doctrine://default?queue_name=opendxp_core"
            opendxp_maintenance: "doctrine://default?queue_name=opendxp_maintenance"
            opendxp_scheduled_tasks: "doctrine://default?queue_name=opendxp_scheduled_tasks"
            opendxp_image_optimize: "doctrine://default?queue_name=opendxp_image_optimize"
            opendxp_asset_update: "doctrine://default?queue_name=opendxp_asset_update"
            #Dependency resolving is synchronous by default, use the following commented lines below (transports/routing) to make it async
            #opendxp_dependencies: "doctrine://default?queue_name=opendxp_dependencies"
        routing:
            'OpenDxp\Messenger\VideoConvertMessage': opendxp_core
            'OpenDxp\Messenger\CleanupThumbnailsMessage': opendxp_core
            'OpenDxp\Messenger\SanityCheckMessage': opendxp_core
            'OpenDxp\Messenger\AssetUpdateTasksMessage': opendxp_asset_update
            'OpenDxp\Messenger\AssetPreviewImageMessage': opendxp_core
            'OpenDxp\Messenger\GeneratePagePreviewMessage': opendxp_core
            'OpenDxp\Messenger\VersionDeleteMessage': opendxp_core
            'OpenDxp\Messenger\OptimizeImageMessage': opendxp_image_optimize
            'OpenDxp\Messenger\MaintenanceTaskMessage': opendxp_maintenance
            'OpenDxp\Messenger\ScheduledTaskMessage': opendxp_scheduled_tasks
            #'OpenDxp\Messenger\ElementDependenciesMessage': opendxp_dependencies
        default_bus: messenger.bus.opendxp-core
        buses:
            messenger.bus.opendxp-core:
    property_info:
        enabled: true
        with_constructor_extractor: true
    rate_limiter:
        reset_password:
            policy: 'fixed_window'
            limit: 5
            interval: '5 minutes'
    html_sanitizer:
        sanitizers:
            opendxp.wysiwyg_sanitizer:
                max_input_length: -1
                allow_attributes:
                    opendxp_type: '*'
                    opendxp_id: '*'
                allow_relative_links: true
                allow_relative_medias: true
                allow_elements:
                    span: [ 'class', 'style', 'id' ]
                    div: [ 'class', 'style', 'id' ]
                    p: [ 'class', 'style', 'id', 'dir', 'data-cell' ]
                    strong: 'class'
                    em: 'class'
                    h1: [ 'class', 'id' ]
                    h2: [ 'class', 'id' ]
                    h3: [ 'class', 'id' ]
                    h4: [ 'class', 'id' ]
                    h5: [ 'class', 'id' ]
                    h6: [ 'class', 'id' ]
                    a: [ 'class', 'id', 'href', 'target', 'title', 'rel', 'style' ]
                    table: [ 'class', 'style', 'cellspacing', 'cellpadding', 'border', 'width', 'height', 'id' ]
                    colgroup: 'class'
                    col: [ 'class', 'style', 'id' ]
                    thead: [ 'class', 'id', 'style' ]
                    tbody: [ 'class', 'id', 'style' ]
                    tr: [ 'class', 'id', 'style', 'colspan', 'rowspan' ]
                    td: [ 'class', 'id', 'style', 'colspan', 'rowspan', 'data-row', 'width', 'height' ]
                    th: [ 'class', 'id', 'scope', 'style', 'colspan', 'rowspan', 'width', 'height' ]
                    ul: [ 'class', 'style', 'id' ]
                    li: [ 'class', 'style', 'id' ]
                    ol: [ 'class', 'style', 'id' ]
                    u: [ 'class', 'id' ]
                    i: [ 'class', 'id' ]
                    b: [ 'class', 'id' ]
                    caption: [ 'class', 'id' ]
                    sub: [ 'class', 'id' ]
                    sup: [ 'class', 'id' ]
                    blockquote: [ 'class', 'id' ]
                    s: [ 'class', 'id' ]
                    iframe: [ 'frameborder', 'height', 'longdesc', 'name', 'sandbox', 'scrolling', 'src', 'title', 'width' ]
                    br: ''
                    img: [ 'class', 'id', 'alt', 'style', 'src' ]
                    hr: ''
            opendxp.translation_sanitizer:
                allow_attributes:
                    opendxp_type: '*'
                    opendxp_id: '*'
                allow_relative_links: true
                allow_elements:
                    span: [ 'class', 'style', 'id' ]
                    p: [ 'class', 'style', 'id' ]
                    strong: 'class'
                    em: 'class'
                    h1: [ 'class', 'id' ]
                    h2: [ 'class', 'id' ]
                    h3: [ 'class', 'id' ]
                    h4: [ 'class', 'id' ]
                    h5: [ 'class', 'id' ]
                    h6: [ 'class', 'id' ]
                    a: [ 'class', 'id', 'href', 'target', 'title', 'rel' ]
                    br: ''

# Twig Configuration
twig:
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"
    globals:
        # avoid fetching and using services from templates if possible
        # this is only here for compatibility/dev reasons and may be removed later
        container: '@service_container'
        document: ~
        editmode: false
    paths:
        '%kernel.project_dir%/templates': App

# Doctrine Configuration
doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                driver: pdo_mysql
                charset: UTF8MB4
                logging: false
                profiling: false
                options:
                  !php/const PDO::MYSQL_ATTR_INIT_COMMAND: "SET sql_mode = '';"
                default_table_options:
                    charset: UTF8MB4
                    engine: InnoDB
                    collate: utf8mb4_general_ci

# Monolog Configuration
monolog:
    channels: ['opendxp', 'opendxp_api', 'session']
    handlers:
        redirect:
            type: stream
            path:  "%kernel.logs_dir%/redirect.log"
            level: debug
            channels: ['redirect']

# CMF routing
cmf_routing:
    chain:
        routers_by_id:
            router.default:             300
            cmf_routing.dynamic_router: 200
    dynamic:
        route_provider_service_id: OpenDxp\Routing\DynamicRouteProvider

# OpenDXP
opendxp:
    bundles:
        search_paths:
            - src
            - vendor/open-dxp/opendxp/bundles

    assets:
        metadata:
            class_definitions:
                data:
                    map:
                        asset: \OpenDxp\Model\Asset\MetaData\ClassDefinition\Data\Asset
                        checkbox: \OpenDxp\Model\Asset\MetaData\ClassDefinition\Data\Checkbox
                        date: \OpenDxp\Model\Asset\MetaData\ClassDefinition\Data\Date
                        document: \OpenDxp\Model\Asset\MetaData\ClassDefinition\Data\Document
                        input: \OpenDxp\Model\Asset\MetaData\ClassDefinition\Data\Input
                        object: \OpenDxp\Model\Asset\MetaData\ClassDefinition\Data\DataObject
                        select: \OpenDxp\Model\Asset\MetaData\ClassDefinition\Data\Select
                        textarea: \OpenDxp\Model\Asset\MetaData\ClassDefinition\Data\Textarea
        type_definitions:
            map:
                unknown:
                    class: \OpenDxp\Model\Asset\Unknown
                    matching: [ "/\\.dwg$/", "/\\.stp$/" ]
                image:
                    class: \OpenDxp\Model\Asset\Image
                    matching: ['/image/', "/\\.eps$/", "/\\.ai$/", "/\\.psd$/", "/\\.svgz$/", "/\\.pcx$/", "/\\.iff$/", "/\\.pct$/", "/\\.wmf$/", '/photoshop/']
                archive:
                    class: \OpenDxp\Model\Asset\Archive
                    matching: ['/zip/', '/tar/']
                audio:
                    class: \OpenDxp\Model\Asset\Audio
                    matching: ['/audio/']
                document:
                    class: \OpenDxp\Model\Asset\Document
                    matching: ['/msword/', '/pdf/', '/powerpoint/', '/office/', '/excel/', '/opendocument/']
                folder:
                    class: \OpenDxp\Model\Asset\Folder
                text:
                   class: \OpenDxp\Model\Asset\Text
                   matching: [ "/text\\//", "/xml$/", "/\\.json$/" ]
                video:
                   class: \OpenDxp\Model\Asset\Video
                   matching: [ "/video/" ]

    objects:
        class_definitions:
            data:
                map:
                    block: \OpenDxp\Model\DataObject\ClassDefinition\Data\Block
                    calculatedValue: \OpenDxp\Model\DataObject\ClassDefinition\Data\CalculatedValue
                    checkbox: \OpenDxp\Model\DataObject\ClassDefinition\Data\Checkbox
                    classificationstore: \OpenDxp\Model\DataObject\ClassDefinition\Data\Classificationstore
                    consent: \OpenDxp\Model\DataObject\ClassDefinition\Data\Consent
                    country: \OpenDxp\Model\DataObject\ClassDefinition\Data\Country
                    countrymultiselect: \OpenDxp\Model\DataObject\ClassDefinition\Data\Countrymultiselect
                    date: \OpenDxp\Model\DataObject\ClassDefinition\Data\Date
                    datetime: \OpenDxp\Model\DataObject\ClassDefinition\Data\Datetime
                    email: \OpenDxp\Model\DataObject\ClassDefinition\Data\Email
                    encryptedField: \OpenDxp\Model\DataObject\ClassDefinition\Data\EncryptedField
                    externalImage: \OpenDxp\Model\DataObject\ClassDefinition\Data\ExternalImage
                    fieldcollections: \OpenDxp\Model\DataObject\ClassDefinition\Data\Fieldcollections
                    firstname: \OpenDxp\Model\DataObject\ClassDefinition\Data\Firstname
                    gender: \OpenDxp\Model\DataObject\ClassDefinition\Data\Gender
                    geobounds: \OpenDxp\Model\DataObject\ClassDefinition\Data\Geobounds
                    geopoint: \OpenDxp\Model\DataObject\ClassDefinition\Data\Geopoint
                    geopolygon: \OpenDxp\Model\DataObject\ClassDefinition\Data\Geopolygon
                    geopolyline: \OpenDxp\Model\DataObject\ClassDefinition\Data\Geopolyline
                    hotspotimage: \OpenDxp\Model\DataObject\ClassDefinition\Data\Hotspotimage
                    manyToOneRelation: \OpenDxp\Model\DataObject\ClassDefinition\Data\ManyToOneRelation
                    image: \OpenDxp\Model\DataObject\ClassDefinition\Data\Image
                    imageGallery: \OpenDxp\Model\DataObject\ClassDefinition\Data\ImageGallery
                    input: \OpenDxp\Model\DataObject\ClassDefinition\Data\Input
                    language: \OpenDxp\Model\DataObject\ClassDefinition\Data\Language
                    languagemultiselect: \OpenDxp\Model\DataObject\ClassDefinition\Data\Languagemultiselect
                    lastname: \OpenDxp\Model\DataObject\ClassDefinition\Data\Lastname
                    link: \OpenDxp\Model\DataObject\ClassDefinition\Data\Link
                    localizedfields: \OpenDxp\Model\DataObject\ClassDefinition\Data\Localizedfields
                    manyToManyRelation: \OpenDxp\Model\DataObject\ClassDefinition\Data\ManyToManyRelation
                    advancedManyToManyRelation: \OpenDxp\Model\DataObject\ClassDefinition\Data\AdvancedManyToManyRelation
                    multiselect: \OpenDxp\Model\DataObject\ClassDefinition\Data\Multiselect
                    reverseObjectRelation: \OpenDxp\Model\DataObject\ClassDefinition\Data\ReverseObjectRelation
                    urlSlug: \OpenDxp\Model\DataObject\ClassDefinition\Data\UrlSlug
                    numeric: \OpenDxp\Model\DataObject\ClassDefinition\Data\Numeric
                    numericRange: \OpenDxp\Model\DataObject\ClassDefinition\Data\NumericRange
                    objectbricks: \OpenDxp\Model\DataObject\ClassDefinition\Data\Objectbricks
                    manyToManyObjectRelation: \OpenDxp\Model\DataObject\ClassDefinition\Data\ManyToManyObjectRelation
                    advancedManyToManyObjectRelation: \OpenDxp\Model\DataObject\ClassDefinition\Data\AdvancedManyToManyObjectRelation
                    password: \OpenDxp\Model\DataObject\ClassDefinition\Data\Password
                    rgbaColor: \OpenDxp\Model\DataObject\ClassDefinition\Data\RgbaColor
                    quantityValue: \OpenDxp\Model\DataObject\ClassDefinition\Data\QuantityValue
                    quantityValueRange: \OpenDxp\Model\DataObject\ClassDefinition\Data\QuantityValueRange
                    inputQuantityValue: \OpenDxp\Model\DataObject\ClassDefinition\Data\InputQuantityValue
                    select: \OpenDxp\Model\DataObject\ClassDefinition\Data\Select
                    slider: \OpenDxp\Model\DataObject\ClassDefinition\Data\Slider
                    structuredTable: \OpenDxp\Model\DataObject\ClassDefinition\Data\StructuredTable
                    table: \OpenDxp\Model\DataObject\ClassDefinition\Data\Table
                    textarea: \OpenDxp\Model\DataObject\ClassDefinition\Data\Textarea
                    time: \OpenDxp\Model\DataObject\ClassDefinition\Data\Time
                    user: \OpenDxp\Model\DataObject\ClassDefinition\Data\User
                    video: \OpenDxp\Model\DataObject\ClassDefinition\Data\Video
                    wysiwyg: \OpenDxp\Model\DataObject\ClassDefinition\Data\Wysiwyg

                prefixes:
                    - \OpenDxp\Model\DataObject\ClassDefinition\Data\
                    - \Object_Class_Data_

            layout:
                prefixes:
                    - \OpenDxp\Model\DataObject\ClassDefinition\Layout\
                    - \Object_Class_Layout_

    documents:
        type_definitions:
            map:
                folder:
                    class: \OpenDxp\Model\Document\Folder
                    translatable: false
                    translatable_inheritance: true
                page:
                    class: \OpenDxp\Model\Document\Page
                    valid_table: 'page'
                    direct_route: true
                    predefined_document_types: true
                snippet:
                    class: \OpenDxp\Model\Document\Snippet
                    valid_table: 'snippet'
                    children_supported: false
                    direct_route: true
                    predefined_document_types: true
                link:
                    class: \OpenDxp\Model\Document\Link
                    translatable: false
                    valid_table: 'link'
                hardlink:
                    class: \OpenDxp\Model\Document\Hardlink
                    translatable: false
                    valid_table: 'hardlink'
                email:
                    class: \OpenDxp\Model\Document\Email
                    valid_table: 'email'
                    translatable_inheritance: false
                    children_supported: false
                    direct_route: true
                    predefined_document_types: true
        editables:
            prefixes:
                - \OpenDxp\Model\Document\Editable\

    # the routes below are used to determine the request context in OpenDxpContextGuesser
    context:
        profiler:
            routes:
                - { path: ^/_(profiler|wdt)(/.*)?$ }
    translations:
        domains:
            - messages
            - admin

    templating_engine:
        twig:
            sandbox_security_policy:
                tags: ['set']
                filters: ['escape', 'trans', 'default']
                functions: ['path', 'asset']
                methods:
                    DateTimeInterface: ['format']
                readable_classes:
                    - OpenDxp\Model\Element\ElementInterface
                    - OpenDxp\Model\DataObject\OwnerAwareFieldInterface
                    - OpenDxp\Model\DataObject\ObjectAwareFieldInterface
                    - OpenDxp\Model\DataObject\Classificationstore
                    - OpenDxp\Model\DataObject\QuantityValue\Unit
                    - OpenDxp\Model\Asset\Thumbnail\ImageThumbnailInterface
                    - DateTimeInterface

    gotenberg:
        base_url: 'http://gotenberg:3000'

    config_location:
        select_options:
            read_target:
                type: 'symfony-config'

    dependency:
        enabled: true
