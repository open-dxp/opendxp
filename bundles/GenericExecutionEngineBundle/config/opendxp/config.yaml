imports:
    - { resource: default.yaml }
    - { resource: doctrine.yaml }
    - { resource: doctrine_migrations.yaml }

monolog:
    channels: ['generic_execution_engine']

framework:
    messenger:
        buses:
          generic.execution.engine.bus:
            middleware:
              - 'OpenDxp\Bundle\GenericExecutionEngineBundle\Messenger\Middleware\JobTrackingMiddleware'
              - 'OpenDxp\Messenger\Middleware\CollectGarbageMiddleware'
              - 'OpenDxp\Bundle\GenericExecutionEngineBundle\Messenger\Middleware\StepConditionMiddleware'
        enabled: true
        transports:
            opendxp_generic_execution_engine:
                dsn: 'doctrine://default?queue_name=opendxp_generic_execution_engine'
                retry_strategy:
                    max_retries: 0 # no retries to prevent data corruption