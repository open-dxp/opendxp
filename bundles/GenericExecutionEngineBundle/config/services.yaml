services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    _instanceof:
        # all services implementing the GenericExecutionEngineMessageInterface
        # will be registered on the bus
        OpenDxp\Bundle\GenericExecutionEngineBundle\Messenger\Messages\GenericExecutionEngineMessageInterface:
            tags:
                - { name: messenger.message_handler, bus: generic.execution.engine.bus }

    #
    # Installer

    OpenDxp\Bundle\GenericExecutionEngineBundle\Installer:
        public: true
        arguments:
            $bundle: "@=service('kernel').getBundle('OpenDxpGenericExecutionEngineBundle')"


    OpenDxp\Bundle\GenericExecutionEngineBundle\Controller\:
        resource: '../src/Controller'
        public: true
        tags: ['controller.service_arguments']

    #
    # Job Execution Engine

    OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\JobExecutionAgentInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\JobExecutionAgent
        arguments:
            $environment: '%kernel.environment%'
            $executionEngineBus: '@generic.execution.engine.bus'
            $sendersLocator: '@messenger.senders_locator'

    OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\JobExecutionAgent:
        alias: OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\JobExecutionAgentInterface

    OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\JobTrackingAgentInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\JobTrackingAgent

    OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\JobTrackingAgent:
        alias: OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\JobTrackingAgentInterface

    OpenDxp\Bundle\GenericExecutionEngineBundle\Agent\PendingOperations: ~

    OpenDxp\Bundle\GenericExecutionEngineBundle\Repository\JobRunRepositoryInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\Repository\JobRunRepository

    OpenDxp\Bundle\GenericExecutionEngineBundle\Repository\JobRunRepository:
        alias: OpenDxp\Bundle\GenericExecutionEngineBundle\Repository\JobRunRepositoryInterface

    OpenDxp\Bundle\GenericExecutionEngineBundle\Storage\JobRunArtifactStorage: ~

    OpenDxp\Bundle\GenericExecutionEngineBundle\Repository\JobRunErrorLogRepositoryInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\Repository\JobRunErrorLogRepository

    OpenDxp\Bundle\GenericExecutionEngineBundle\Grid\JobRunGridInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\Grid\JobRunGrid

    OpenDxp\Bundle\GenericExecutionEngineBundle\CurrentMessage\CurrentMessageProviderInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\CurrentMessage\CurrentMessageProvider

    OpenDxp\Bundle\GenericExecutionEngineBundle\EventSubscriber\JobExecutionSubscriber: ~

    OpenDxp\Bundle\GenericExecutionEngineBundle\EventSubscriber\JobRunStatusChangeSubscriber:
        tags:
            - { name: doctrine.event_listener, event: preUpdate,  priority: 500, connection: default }

    OpenDxp\Bundle\GenericExecutionEngineBundle\EventSubscriber\PostGenerateJobSchemaSubscriber: ~

    OpenDxp\Bundle\GenericExecutionEngineBundle\Extractor\JobRunExtractorInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\Extractor\JobRunExtractor

    #
    # Security Services

    OpenDxp\Bundle\GenericExecutionEngineBundle\Security\PermissionServiceInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\Security\PermissionService

    #
    # Configuration

    OpenDxp\Bundle\GenericExecutionEngineBundle\Configuration\ExecutionContextInterface:
        class: OpenDxp\Bundle\GenericExecutionEngineBundle\Configuration\ExecutionContext

    OpenDxp\Bundle\GenericExecutionEngineBundle\Configuration\ExecutionContext:
        alias: OpenDxp\Bundle\GenericExecutionEngineBundle\Configuration\ExecutionContextInterface

    #
    # Maintenance

    OpenDxp\Bundle\GenericExecutionEngineBundle\Maintenance\JobRunCleanupTask:
        tags:
            - { name: opendxp.maintenance.task, type: jobruncleanup }


    #
    # Middleware


    OpenDxp\Messenger\Middleware\CollectGarbageMiddleware:
        tags:
            - { name: "messenger.middleware" }

    OpenDxp\Bundle\GenericExecutionEngineBundle\Messenger\Middleware\StepConditionMiddleware:
        tags:
            - { name: "messenger.middleware" }

    OpenDxp\Bundle\GenericExecutionEngineBundle\Messenger\Middleware\JobTrackingMiddleware:
        tags:
            - { name: "messenger.middleware" }
