        autowire: true
        autoconfigure: true

    OpenDxp\Bundle\InstallBundle\Command\:
        resource: '../src/Command'
        public: true
        tags: ['console.command']

    OpenDxp\Composer\PackageInfo: ~

    OpenDxp\Extension\Bundle\OpenDxpBundleLocator:
        arguments:
            $paths: []

    OpenDxp\Bundle\InstallBundle\Installer: ~
