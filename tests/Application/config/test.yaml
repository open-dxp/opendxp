parameters:
    # An encrypted field needs a key. This one belongs to the test application and encrypts nothing else.
    opendxp.encryption.secret: 'def0000021cc887a70b119fec21a31a040f3397e9481d22d18055f3c63740444af9836f5ea44de9dcdd66ae222bebda4537a9da8cd5446e0a222a4dd36716596a9146632'

services:
    OpenDxp\Tests\Application\Areabrick\Greeting:
        tags:
            - { name: opendxp.area.brick, id: greeting }

    # The Unittest class definition names this id for its calculated value.
    test.calculatorservice:
        class: OpenDxp\Tests\Application\Service\Calculator

    # The proxy lets a test swap the version storage adapter at runtime.
    OpenDxp\Model\Version\Adapter\ProxyVersionStorageAdapter:
        autowire: true

    OpenDxp\Model\Version\Adapter\VersionStorageAdapterInterface:
        public: true
        alias: OpenDxp\Model\Version\Adapter\ProxyVersionStorageAdapter

twig:
    paths:
        '%kernel.project_dir%/tests/Application/templates': ~

opendxp:
    general:
        domain: 'opendxp-testing.test'
        fallback_languages:
            de: en

    templating_engine:
        twig:
            sandbox_security_policy:
                methods:
                    Symfony\Bridge\Twig\AppVariable: ['getEnvironment']

    email:
        sender:
            name: 'OpenDXP Tests'
            email: 'sender@tests.local'
        return:
            name: 'OpenDXP Tests'
            email: 'return@tests.local'
